<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Five Nights at Freddy's 4</title>
    <link rel="icon" href="favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(resources/office.png);
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100%;
        }

        a {
            text-decoration: none;
        }

        .selection {
            height: auto;
            min-height: 100vh;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        .launcher-text {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 2.5vh;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        .glitch {
            position: absolute;
            background-image: url(resources/background.gif);
            background-position: center;
            background-size: 50vw;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.75;
            z-index: -1;
        }

        canvas {
            display: none;
            user-select: none;
            max-width: min(100vw, 1280px);
            max-height: min(100vh, 720px);
            width: auto;
            height: auto;
        }

        #title {
            position: absolute;
            top: 10vh;
            left: 5vw;
            z-index: 1;
            height: 20vh;
        }

        #animatronic {
            position: absolute;
            top: -5vh;
            right: 7vw;
            height: 120vh;
        }

        .loader {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 12vh;
            z-index: 1;
            color: white;
            font-family: monospace;
            text-align: center;
            font-weight: lighter;
            width: 85vw;
        }

        .loader h1 {
            margin: 0;
            font-size: 5vw;
        }

        .loader hr{
            margin: 0;
            border: white solid 0.1vw;
            width: 0%;
        }

        .loader h2 {
            margin: 1vh 0;
            font-size: 1.4vw;
        }
    
        /* Mobile display: preserve the original game canvas and its aspect ratio. */
        @media (max-width: 700px), (pointer: coarse) {
            html, body {
                width: 100%;
                height: 100%;
                min-height: 100%;
                overflow: hidden;
            }
            body {
                height: 100dvh;
                min-height: 100dvh;
                padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            }
            canvas {
                max-width: min(100vw, 1280px);
                max-height: min(100dvh, 720px);
                width: auto;
                height: auto;
                touch-action: none;
            }
            .selection { min-height: 100dvh; }
            #title {
                top: 7vh;
                left: 5vw;
                height: 15vh;
                max-width: 55vw;
                object-fit: contain;
            }
            #animatronic {
                top: 5vh;
                right: -8vw;
                height: 75vh;
                max-width: 65vw;
                object-fit: contain;
            }
            .loader {
                bottom: max(10vh, calc(env(safe-area-inset-bottom) + 24px));
                width: 90vw;
            }
            .loader h1 { font-size: clamp(28px, 9vw, 54px); }
            .loader h2 { font-size: clamp(11px, 3vw, 16px); }
            .glitch, .vignette { height: 100dvh; }
            .launcher-text img { width: min(65vw, 320px) !important; }
        }
    
        /* Real mobile play layout: fit the native game canvas to the usable viewport. */
        @media (max-width: 700px), (pointer: coarse) {
            html, body {
                width: 100%;
                height: 100%;
                min-height: 100%;
                margin: 0;
                overflow: hidden;
            }
            body {
                width: 100vw;
                height: 100dvh;
                min-height: 100dvh;
                box-sizing: border-box;
                padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
                display: flex;
                align-items: center;
                justify-content: center;
                overscroll-behavior: none;
            }
            canvas#MMFCanvas {
                display: none;
                max-width: none;
                max-height: none;
                width: auto;
                height: auto;
                flex: none;
                touch-action: none;
                -webkit-tap-highlight-color: transparent;
            }
            .selection { min-height: 100dvh; }
            .glitch, .vignette { height: 100dvh; }
            #mobileRotateNotice {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                padding: 28px;
                text-align: center;
                color: #f5f0e8;
                background: rgba(0,0,0,.94);
                font: 600 13px/1.6 monospace;
                letter-spacing: .08em;
            }
            #mobileRotateNotice .rotate-icon { font-size: 46px; line-height: 1; }
            #mobileRotateNotice strong { color: #d8b467; font-size: 16px; }
            #mobileRotateNotice button, #mobileFullscreen {
                min-width: 48px;
                min-height: 48px;
                border: 1px solid rgba(216,180,103,.7);
                border-radius: 4px;
                color: #f5e8cb;
                background: rgba(30,23,14,.96);
                font: 600 12px monospace;
                touch-action: manipulation;
            }
            #mobileFullscreen {
                position: fixed;
                z-index: 90;
                right: max(10px, env(safe-area-inset-right));
                bottom: max(10px, env(safe-area-inset-bottom));
                display: none;
                width: 48px;
                padding: 0;
                font-size: 22px;
            }
            @media (orientation: portrait) {
                #mobileRotateNotice { display: flex; }
                #mobileFullscreen { display: none; }
            }
            @media (orientation: landscape) {
                #mobileFullscreen { display: block; }
            }
        }
    </style>
</head>

<body>
    <canvas id="MMFCanvas" width="1024" height="768"> Your browser does not support Canvas, Please try again.</canvas>
    <div class="selection" id="selection">
        <img id="title" src="resources/title.png">
        <img id="animatronic" src="resources/animatronic.png">
        <div class="loader">
            <h1 id="percentage">0%</h1>
            <hr id="bar">
            <h2 id="stage">STARTING UP...</h2>
        </div>
        <a href="https://discord.gg/xuu8TnSY4b">
            <div class="launcher-text"><img src="resources/launcher-text.png" style="width: 45vw;"></div>
        </a>
    </div>
    <div class="glitch"></div>
    <img src="resources/vignette.png" class="vignette">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <div id="mobileRotateNotice" role="status" aria-live="polite">
        <div class="rotate-icon" aria-hidden="true">↻</div>
        <strong>GIRA EL MÓVIL</strong>
        <span>Este juego está diseñado para jugarse en horizontal. Gira el dispositivo para aprovechar toda la pantalla.</span>
        <button id="mobileRotateFullscreen" type="button">PANTALLA COMPLETA</button>
    </div>
    <button id="mobileFullscreen" type="button" aria-label="Activar pantalla completa" title="Pantalla completa">⛶</button>
</body>

<script>
    const parts = 20;
    let gametitle, runtimecanvas
    gametitle = document.title;
    runtimecanvas = "resources/fnaf 4.cch";
    // Prevents touchscreen move
    // Fullscreen Key
    const pressedKeys = {};
    document.addEventListener('keydown', event => {
        pressedKeys[event.key] = true;
        if (pressedKeys['-'] && pressedKeys['=']) {
            document.querySelector('canvas').requestFullscreen();
            delete pressedKeys[event.key];
        }
    });
    document.addEventListener('keyup', (event) => {
        delete pressedKeys[event.key];
    });
    // -----------------
    window.onload = function () {
        const map = new Map();

        function updateProgress(text, percent) {
            document.title = percent + '% ' + gametitle
            document.getElementById('percentage').textContent = percent + '%';
            document.getElementById('bar').style.width = percent + '%';
            document.getElementById('stage').textContent = text;
        }

        async function intercept() {
            const ogfetch = window.fetch;
            window.fetch = async function (input, init) {
                if (typeof input === 'string' && input.startsWith('resources/')) {
                    const fileName = input.split('/').pop();
                    if (map.has(fileName)) {
                        return ogfetch(map.get(fileName), init);
                    }
                }
                return ogfetch(input, init);
            };

            const ogopen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url) {
                if (url.startsWith('resources/')) {
                    const fileName = url.split('/').pop();
                    if (map.has(fileName)) {
                        url = map.get(fileName);
                    }
                }
                return ogopen.apply(this, arguments);
            };

            const types = [HTMLImageElement, HTMLAudioElement, HTMLVideoElement];
            for (const Tag of types) {
                const descriptor = Object.getOwnPropertyDescriptor(Tag.prototype, 'src');
                if (descriptor && descriptor.set) {
                    Object.defineProperty(Tag.prototype, 'src', {
                        configurable: true,
                        enumerable: true,
                        get: descriptor.get,
                        set: function (val) {
                            if (typeof val === 'string' && val.startsWith('resources/')) {
                                const fileName = val.split('/').pop();
                                if (map.has(fileName)) {
                                    val = map.get(fileName);
                                }
                            }
                            descriptor.set.call(this, val);
                        }
                    });
                }
            }
        }

        async function extract() {
            if (!window.JSZip) throw new Error("The ZIP library could not be loaded.");
            const response = await fetch("resources.zip");
            if (!response.ok) throw new Error("The resources archive could not be downloaded.");

            // Read the merged archive once instead of retaining a second chunks array.
            const arrayBuffer = await response.arrayBuffer();
            updateProgress('RETURNING GEARS...', 50);
            const zip = await JSZip.loadAsync(arrayBuffer);
            const files = Object.keys(zip.files).filter(name => !zip.files[name].dir);
            const totalFiles = files.length;
            if (!totalFiles) throw new Error("The resources archive is empty.");

            for (let i = 0; i < totalFiles; i++) {
                const file = zip.files[files[i]];
                const blob = await file.async("blob");
                const url = URL.createObjectURL(blob);
                map.set(files[i], url);
                updateProgress('BOOTING UP ARCHIVE...', Math.floor(((i + 1) / totalFiles / 2) * 100 + 50));
            }
        }

        async function wedone(resourcesUrl) {
            try {
                await extract();
            } finally {
                // The merged ZIP is no longer needed once JSZip has read it.
                URL.revokeObjectURL(resourcesUrl);
            }
            await intercept();

            const script = document.createElement('script');
            script.src = 'src/Runtime.js';
            script.onload = () => {
                try {
                    new Runtime("MMFCanvas", runtimecanvas);
                    document.getElementById('MMFCanvas').style.display = 'block';
                    window.fitMobileCanvas?.();
                    document.getElementById('selection').style.display = 'none';
                    document.title = gametitle;
                } catch (error) {
                    document.getElementById('stage').textContent = "ERROR: " + error.message;
                }
            };
            script.onerror = () => {
                document.getElementById('stage').textContent = "ERROR: Runtime.js could not be loaded.";
            };
            document.head.appendChild(script);
        }

        const originalFetch = window.fetch;

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                const buffers = [];

                async function fetchParts() {
                    try {
                        // Descarga hasta cuatro fragmentos a la vez sin cambiar su orden.
                        // Esto reduce la espera de red y limita el uso de memoria.
                        const workerCount = Math.min(4, fileParts.length);
                        let nextPart = 0;
                        let completedParts = 0;

                        async function worker() {
                            while (true) {
                                const index = nextPart++;
                                if (index >= fileParts.length) return;

                                const response = await fetch(fileParts[index]);
                                if (!response.ok) {
                                    throw new Error("Missing part: " + fileParts[index]);
                                }

                                buffers[index] = await response.arrayBuffer();
                                completedParts++;
                                updateProgress(
                                    'LOCATING ARCHIVE...',
                                    Math.floor((completedParts / fileParts.length / 2) * 100)
                                );
                            }
                        }

                        await Promise.all(
                            Array.from({ length: workerCount }, () => worker())
                        );

                        const mergedBlob = new Blob(buffers);
                        buffers.length = 0;
                        resolve(URL.createObjectURL(mergedBlob));
                    } catch (error) {
                        document.getElementById('stage').textContent = "ERROR: " + error.message;
                        reject(error);
                    }
                }

                fetchParts();
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("src/resources.zip", 1, parts))
        ]).then(async ([resources]) => {
            window.fetch = async function (url, ...args) {
                if (typeof url === "string" && url.endsWith("resources.zip")) {
                    return originalFetch(resources, ...args);
                }
                return originalFetch(url, ...args);
            };
            await wedone(resources);
        }).catch(error => {
            const stage = document.getElementById('stage');
            if (stage) stage.textContent = "ERROR: " + error.message;
            document.title = "ERROR // " + gametitle;
        });
    };
</script>

<script>
(function () {
    const canvas = document.getElementById('MMFCanvas');
    const mobile = window.matchMedia('(max-width: 700px), (pointer: coarse)');
    if (!canvas) return;

    function fitMobileCanvas() {
        if (!mobile.matches || canvas.style.display === 'none') return;
        const viewport = window.visualViewport;
        const viewportWidth = viewport ? viewport.width : window.innerWidth;
        const viewportHeight = viewport ? viewport.height : window.innerHeight;
        const safe = getComputedStyle(document.body);
        const horizontal = (parseFloat(safe.paddingLeft) || 0) + (parseFloat(safe.paddingRight) || 0);
        const vertical = (parseFloat(safe.paddingTop) || 0) + (parseFloat(safe.paddingBottom) || 0);
        const availableWidth = Math.max(1, viewportWidth - horizontal);
        const availableHeight = Math.max(1, viewportHeight - vertical);
        const scale = Math.min(availableWidth / canvas.width, availableHeight / canvas.height);
        canvas.style.width = Math.floor(canvas.width * scale) + 'px';
        canvas.style.height = Math.floor(canvas.height * scale) + 'px';
    }

    window.fitMobileCanvas = fitMobileCanvas;
    window.addEventListener('resize', fitMobileCanvas, { passive: true });
    window.addEventListener('orientationchange', fitMobileCanvas, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitMobileCanvas, { passive: true });
    document.addEventListener('fullscreenchange', fitMobileCanvas);

    async function enterFullscreen() {
        try {
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                await document.documentElement.requestFullscreen();
            }
            if (screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); } catch (_) {}
            }
        } catch (_) {}
        fitMobileCanvas();
    }

    const full = document.getElementById('mobileFullscreen');
    const rotateFull = document.getElementById('mobileRotateFullscreen');
    if (full) full.addEventListener('click', enterFullscreen);
    if (rotateFull) rotateFull.addEventListener('click', enterFullscreen);
})();
</script>
</html>
